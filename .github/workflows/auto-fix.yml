name: Code Quality & Auto-Fix PR

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码，但禁止持久化 GITHUB_TOKEN 凭据
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # 关键：防止 GITHUB_TOKEN 干扰后续 git push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff bandit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      # 判断是否为自动修复分支（避免循环）
      - name: Determine if this is an auto-fix PR
        id: check_auto_fix
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          if [[ "$BRANCH_NAME" == auto-fix/* ]]; then
            echo "is_auto_fix=true" >> $GITHUB_OUTPUT
          else
            echo "is_auto_fix=false" >> $GITHUB_OUTPUT
          fi

      # ========== 对自动修复 PR 仅做检查，不修复 ==========
      - name: Run checks (for auto-fix PRs)
        if: steps.check_auto_fix.outputs.is_auto_fix == 'true'
        run: |
          black --check .
          ruff check .
          bandit -r . -ll --skip B101

      # ========== 对普通 PR 执行自动修复 ==========
      # 1. 先运行检查（仅报告，不阻断）
      - name: Run Black check (non-fix)
        if: steps.check_auto_fix.outputs.is_auto_fix == 'false'
        run: black --check . || true

      - name: Run Ruff lint (non-fix)
        if: steps.check_auto_fix.outputs.is_auto_fix == 'false'
        run: ruff check . || true

      - name: Run Bandit security scan
        if: steps.check_auto_fix.outputs.is_auto_fix == 'false'
        run: bandit -r . -ll --skip B101 || true

      # 2. 自动修复（Black + Ruff --fix）
      - name: Auto-fix with Black and Ruff
        if: steps.check_auto_fix.outputs.is_auto_fix == 'false'
        id: auto_fix
        run: |
          black .
          # Ruff 可能返回非零，但我们要继续执行
          ruff check --fix . || true
          if git diff --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      # 3. 若有变更，创建新的 PR（使用 PAT）
      - name: Create auto-fix PR
        if: steps.auto_fix.outputs.changes == 'true' && steps.check_auto_fix.outputs.is_auto_fix == 'false'
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}   # 需预先配置
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPO_NAME: ${{ github.repository }}
        run: |
          # 安装 GitHub CLI
          sudo apt-get update && sudo apt-get install -y gh

          # 配置 Git 用户
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 将远程 URL 改为包含 PAT 的地址（关键修复）
          git remote set-url origin https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/${REPO_NAME}.git

          # 创建并切换新分支
          NEW_BRANCH="auto-fix/PR-${PR_NUMBER}-$(date +%s)"
          git checkout -b $NEW_BRANCH

          # 提交所有改动
          git add -A
          git commit -m "Auto-fix: apply Black and Ruff fixes"

          # 推送（现在使用正确的远程 URL）
          git push origin $NEW_BRANCH

          # 使用 gh 创建 PR（GH_TOKEN 已设置为 PAT）
          PR_TITLE="[auto-fix] Code style fixes for PR #${PR_NUMBER}"
          PR_BODY="This PR automatically applies Black formatting and Ruff auto-fixes.\\n\\n> ⚠️ Some issues (like invalid module names) cannot be auto-fixed and will remain. Please review manually."
          gh pr create --base "$BASE_BRANCH" \
                       --head "$NEW_BRANCH" \
                       --title "$PR_TITLE" \
                       --body "$PR_BODY" \
                       --label "auto-fix"
